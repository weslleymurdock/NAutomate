name: Integration | Testing | Delivery

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    types: ["opened", "synchronize", "reopened"]

  workflow_dispatch:

jobs:
  integration-testing:
    name: Continuous Integration | Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: ${{ github.workspace }}/src/NAutomate.CLI
        run: dotnet build -c Release
